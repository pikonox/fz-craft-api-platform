services:
  mongo:
    image: mongo:7
    container_name: nova-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - nova-mongo-data:/data/db
    healthcheck:
      # Initialises the single-node replica set on first boot (needed for transactions + change streams)
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  nova-mongo-data:
