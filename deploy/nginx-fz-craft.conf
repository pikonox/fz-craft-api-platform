# FZ-craft site for nginx. Installed by deploy/server-setup.sh (PROXY=nginx) as
# /etc/nginx/sites-available/fz-craft.conf; __DOMAIN__, __WEB_PORT__ and __API_PORT__ are filled in.
# certbot then adds the HTTPS (443) part to this file. Other sites on the server are not touched.

map $http_upgrade $fzcraft_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Uploads: chat attachments up to 20 MB, reference images and payment screenshots up to 10 MB
    client_max_body_size 25m;

    # Dashboard API, the public /v1 API and stored files go straight to the API server
    location ~ ^/(api|v1|files)/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Streamed answers (SSE) are sent to the user token by token, and long generations are allowed
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Everything else: the Next.js website, dashboard and admin
    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fzcraft_connection;
    }
}
