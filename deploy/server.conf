# How FZ-craft is deployed. Read by deploy/push.sh (the server IP is passed on the command line).
#
# This server already runs another site (SmartLink: nginx on 80/443, PM2 apps on 3000 and 5000),
# so FZ-craft uses nginx too, with its own site file and its own ports.

# User to SSH in as
SSH_USER=root

# nginx: the server already runs nginx (adds a site + free HTTPS via certbot)
# caddy: a fresh server with nothing on ports 80/443 (Caddy handles HTTPS)
PROXY=nginx

# Internal ports (only reachable from the server itself; nginx forwards to them)
WEB_PORT=3100
API_PORT=4100

# Public address
DOMAIN=fz-craft.pikonox.com
